<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080706">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A private cinematic memory.">
  <title></title>
  <style>
    :root {
      --bg: #080706;
      --warm-white: rgba(246, 239, 226, 0.94);
      --fade: 4.6s;
      --ease: cubic-bezier(0.65, 0, 0.35, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      position: fixed;
      inset: 0;
      color: var(--warm-white);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    img,
    audio {
      -webkit-user-drag: none;
      user-drag: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 48%, rgba(38, 30, 23, 0.16), transparent 54%),
        #080706;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--fade) var(--ease);
      will-change: opacity;
    }

    .scene.is-visible {
      opacity: 1;
    }

    .scene__atmosphere,
    .scene__veil {
      position: absolute;
      inset: -12%;
      pointer-events: none;
    }

    .scene__atmosphere {
      background-image: var(--photo);
      background-position: center;
      background-size: cover;
      filter: blur(42px) saturate(0.72) brightness(0.32);
      transform: scale(1.14);
      opacity: 0.46;
      will-change: transform, opacity;
    }

    .scene__veil {
      background:
        radial-gradient(
          ellipse at center,
          rgba(8, 7, 6, 0) 20%,
          rgba(8, 7, 6, 0.15) 44%,
          rgba(8, 7, 6, 0.58) 72%,
          rgba(8, 7, 6, 0.98) 100%
        );
      z-index: 1;
    }

    .scene__image {
      position: relative;
      z-index: 2;
      display: block;
      width: min(68vw, 68vh, 860px);
      height: min(68vw, 68vh, 860px);
      max-width: 86vw;
      max-height: 86vh;
      object-fit: contain;
      object-position: center;
      opacity: 0.995;
      filter: brightness(0.985) saturate(0.98);
      transform: translateZ(0);
      will-change: transform, opacity;
    }

    .final-message {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: clamp(7vh, 9vw, 11vh);
      width: min(78vw, 720px);
      transform: translate(-50%, 8px);
      margin: 0;
      color: var(--warm-white);
      font-family: "Baskerville", "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: clamp(0.98rem, 1.45vw, 1.34rem);
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0.045em;
      text-align: center;
      text-wrap: balance;
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.66), 0 1px 3px rgba(0, 0, 0, 0.75);
      opacity: 0;
      pointer-events: none;
      transition: opacity 4s var(--ease), transform 4s var(--ease);
      will-change: opacity, transform;
    }

    .final-message.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .sound-cue {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) {
      .scene__image {
        width: min(78vw, 78vh, 720px);
        height: min(78vw, 78vh, 720px);
        max-width: 88vw;
        max-height: 88vh;
      }

      .scene__atmosphere {
        filter: blur(34px) saturate(0.7) brightness(0.3);
      }

      .final-message {
        bottom: 7.5vh;
        width: min(84vw, 560px);
        font-size: clamp(0.93rem, 3.8vw, 1.16rem);
        line-height: 1.62;
        letter-spacing: 0.035em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --fade: 1.4s;
      }

      .final-message {
        transition-duration: 1.4s;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="A private cinematic memory">
    <section class="scene" data-index="0" style="--photo: url('IMG_5429.PNG');">
      <div class="scene__atmosphere" aria-hidden="true"></div>
      <div class="scene__veil" aria-hidden="true"></div>
      <img class="scene__image" src="IMG_5429.PNG" alt="" draggable="false">
    </section>

    <section class="scene" data-index="1" style="--photo: url('IMG_5427.JPG');">
      <div class="scene__atmosphere" aria-hidden="true"></div>
      <div class="scene__veil" aria-hidden="true"></div>
      <img class="scene__image" src="IMG_5427.JPG" alt="" draggable="false">
    </section>

    <section class="scene" data-index="2" style="--photo: url('IMG_5428.JPG');">
      <div class="scene__atmosphere" aria-hidden="true"></div>
      <div class="scene__veil" aria-hidden="true"></div>
      <img class="scene__image" src="IMG_5428.JPG" alt="" draggable="false">
    </section>

    <section class="scene" data-index="3" style="--photo: url('IMG_5426.PNG');">
      <div class="scene__atmosphere" aria-hidden="true"></div>
      <div class="scene__veil" aria-hidden="true"></div>
      <img class="scene__image" src="IMG_5426.PNG" alt="" draggable="false">
    </section>

    <section class="scene" data-index="4" style="--photo: url('IMG_5430.JPG');">
      <div class="scene__atmosphere" aria-hidden="true"></div>
      <div class="scene__veil" aria-hidden="true"></div>
      <img class="scene__image" src="IMG_5430.JPG" alt="" draggable="false">
    </section>

    <p class="final-message" id="finalMessage">
      Volidam, men kim bo‘lib yetishganim Sizlarning bergan tarbiyangiz, duolaringiz tufaylidir.
    </p>

    <audio id="backgroundMusic" class="sound-cue" preload="auto" loop playsinline>
      <source src="background.mp3" type="audio/mpeg">
    </audio>
  </main>

  <script>
    (() => {
      'use strict';

      const PHOTO_FILES = [
        'IMG_5429.PNG',
        'IMG_5427.JPG',
        'IMG_5428.JPG',
        'IMG_5426.PNG',
        'IMG_5430.JPG'
      ];

      const scenes = [...document.querySelectorAll('.scene')];
      const message = document.getElementById('finalMessage');
      const music = document.getElementById('backgroundMusic');

      const FADE_MS = 4600;
      const HOLD_MS = 15000;
      const INITIAL_PAUSE_MS = 700;
      const FINAL_PHOTO_BEFORE_MESSAGE_MS = 4200;
      const AUDIO_VOLUME = 0.12;

      let sequenceStarted = false;
      let audioUnlocked = false;

      music.volume = AUDIO_VOLUME;

      const preloadImage = (src) => new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = src;
      });

      const preloadAllPhotos = async () => {
        await Promise.all(PHOTO_FILES.map(preloadImage));
      };

      const startMusic = () => {
        if (audioUnlocked) return;
        audioUnlocked = true;
        music.play().catch(() => {
          audioUnlocked = false;
        });
      };

      const beginAudioAttempt = () => {
        music.play().then(() => {
          audioUnlocked = true;
        }).catch(() => {
          audioUnlocked = false;
        });
      };

      const reveal = (index) => {
        scenes.forEach((scene, i) => {
          scene.classList.toggle('is-visible', i === index);
        });
      };

      const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

      const runSequence = async () => {
        if (sequenceStarted) return;
        sequenceStarted = true;

        await preloadAllPhotos();
        await wait(INITIAL_PAUSE_MS);
        reveal(0);
        beginAudioAttempt();

        for (let i = 0; i < scenes.length - 1; i += 1) {
          await wait(FADE_MS + HOLD_MS);
          reveal(i + 1);
        }

        // Give the final photograph a quiet moment before the message emerges.
        await wait(FINAL_PHOTO_BEFORE_MESSAGE_MS);
        message.classList.add('is-visible');
      };

      window.addEventListener('pointerdown', startMusic, { once: true, passive: true });
      window.addEventListener('touchstart', startMusic, { once: true, passive: true });
      window.addEventListener('keydown', startMusic, { once: true, passive: true });
      window.addEventListener('click', startMusic, { once: true, passive: true });

      // Start the visual experience only after the five photographs have been requested.
      // Music attempts autoplay without creating any visible player or controls.
      runSequence();
    })();
  </script>
</body>
</html>
